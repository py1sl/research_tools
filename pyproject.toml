[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tools"
version = "0.1.0"
description = "Research helper tools for markdown notes and PDF metadata extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.24.0",
    "python-frontmatter>=1.3.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["markdown_notes", "pdf_data_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
